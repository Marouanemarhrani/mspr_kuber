# Secret for OpenFaaS functions (namespace openfaas-fn).
# Same credentials as database namespace + POSTGRES_HOST for DNS access.
# Apply after postgres-credentials exists in database (or create with same values).
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: openfaas-fn
type: Opaque
stringData:
  POSTGRES_HOST: postgres.database.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_USER: mspr
  POSTGRES_PASSWORD: mspr
  POSTGRES_DB: msprdb
  ENCRYPTION_KEY: "change-me-32-bytes-key-for-aes!!"
