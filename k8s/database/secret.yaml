# DB credentials - replace placeholder values or use kubectl create secret.
# Apply to namespace database (for Postgres pod) and openfaas-fn (for functions).
# Example: kubectl create secret generic postgres-credentials \
#   --from-literal=POSTGRES_USER=app --from-literal=POSTGRES_PASSWORD=changeme \
#   --from-literal=POSTGRES_DB=mspr -n database
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: database
type: Opaque
stringData:
  POSTGRES_USER: mspr
  POSTGRES_PASSWORD: mspr
  POSTGRES_DB: msprdb
